<header class="site-header">
  <nav class="quick-nav">
    <div class="quick-brand">
      {% load static %}
      <a class="brand-mark brand-logo-link" href="{% url 'home' %}" aria-label="VamikaMart home">
        <img src="{% static 'img/brand/vamikamart-logo.png' %}" alt="VamikaMart">
      </a>
    </div>
    <div class="delivery-copy">
      <strong>Easy grocery runs</strong>
      <span>Fresh, daily and household needs</span>
    </div>
    <form class="quick-search" action="/products/">
      <span aria-hidden="true">Search</span>
      <input name="q" type="search" placeholder='Try "milk", "rice", "cleaner"' aria-label="Search products">
    </form>
    <div class="quick-actions">
      {% if request.user.is_authenticated %}
        <a href="{% url 'orders' %}">Orders</a>
      {% else %}
        <a href="{% url 'login' %}">Login</a>
      {% endif %}
      <a class="cart-button" href="{% url 'cart' %}">
        <span class="cart-icon" aria-hidden="true">🛒</span>
        <span class="cart-label">
          <strong class="js-cart-items">My Cart</strong>
          <small class="js-cart-total" hidden>₹0</small>
        </span>
      </a>
    </div>
  </nav>
</header>
