{% extends "base.html" %}
{% block title %}Action Queues{% endblock %}
{% block content %}
<section class="container py-5">
  <h1>Action Queues</h1>
  {% for item in items %}
    <div class="line-item"><strong>{{ item.title }}</strong><span>{{ item.queue }}</span><span>P{{ item.priority }}</span></div>
  {% empty %}<p>No open actions.</p>{% endfor %}
</section>
{% endblock %}
