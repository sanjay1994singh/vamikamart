{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Commerce{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Modern Django ecommerce store{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="VamikaMart">
  <meta property="og:title" content="{% block og_title %}VamikaMart - Daily basket made easy{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Fresh groceries, daily essentials and household needs from VamikaMart.{% endblock %}">
  <meta property="og:image" content="https://{{ request.get_host }}{% static 'img/brand/vamikamart-og.png' %}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% block twitter_title %}VamikaMart - Daily basket made easy{% endblock %}">
  <meta name="twitter:description" content="{% block twitter_description %}Fresh groceries, daily essentials and household needs from VamikaMart.{% endblock %}">
  <meta name="twitter:image" content="https://{{ request.get_host }}{% static 'img/brand/vamikamart-og.png' %}">
  <link rel="icon" type="image/png" href="{% static 'img/brand/favicon.png' %}">
  <link rel="apple-touch-icon" href="{% static 'img/brand/vamikamart-icon-192.png' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
  {% include "includes/header.html" %}
  <div class="toast-stack" aria-live="polite" aria-atomic="true"></div>
  <main>{% block content %}{% endblock %}</main>
  {% include "includes/footer.html" %}
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
