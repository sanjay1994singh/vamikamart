{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="container py-5 auth-panel">
  <h1>Create Account</h1>
  <a class="btn btn-google" href="{% url 'social:begin' 'google-oauth2' %}?next={{ request.GET.next|default:'/' }}">Continue with Google</a>
  <div class="auth-divider"><span>or</span></div>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Create Account</button>
  </form>
  <p class="auth-switch">Already registered? <a href="{% url 'login' %}">Login</a></p>
</section>
{% endblock %}
