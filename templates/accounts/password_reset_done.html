{% extends "base.html" %}
{% block title %}Reset Link Sent{% endblock %}
{% block content %}
<section class="container py-5 auth-shell">
  <div class="auth-panel auth-status-panel">
    <span class="auth-status-icon" aria-hidden="true">✓</span>
    <p class="eyebrow">Email Sent</p>
    <h1>Reset Link Sent</h1>
    <p class="auth-copy">Please check your email for the password reset link.</p>
    <a class="btn btn-primary" href="{% url 'login' %}">Back to Login</a>
  </div>
</section>
{% endblock %}
