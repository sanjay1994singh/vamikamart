{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<section class="container py-5 auth-panel">
  <h1>Reset Password</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Send Reset Link</button>
  </form>
</section>
{% endblock %}
