{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<section class="container py-5 auth-shell">
  <div class="auth-panel">
  <p class="eyebrow">Account Help</p>
  <h1>Reset Password</h1>
  <p class="auth-copy">Enter your registered email and we will send a secure reset link.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Send Reset Link</button>
  </form>
  </div>
</section>
{% endblock %}
