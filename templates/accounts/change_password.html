{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<section class="container py-5 auth-shell">
  <div class="auth-panel">
  <p class="eyebrow">Security</p>
  <h1>Change Password</h1>
  <p class="auth-copy">Keep your grocery account protected with a fresh password.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Update Password</button>
  </form>
  </div>
</section>
{% endblock %}
