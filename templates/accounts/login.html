{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="container py-5 auth-panel">
  <h1>Login</h1>
  <a class="btn btn-google" href="{% url 'social:begin' 'google-oauth2' %}?next={{ request.GET.next|default:'/' }}">Continue with Google</a>
  <div class="auth-divider"><span>or</span></div>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Login</button>
  </form>
  <p class="auth-switch">New customer? <a href="{% url 'register' %}">Create an account</a></p>
</section>
{% endblock %}
