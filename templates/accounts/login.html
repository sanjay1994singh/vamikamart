{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="container py-5 auth-shell">
  <div class="auth-panel">
    <p class="eyebrow">VamikaMart Account</p>
    <h1>Login</h1>
    <p class="auth-copy">Continue to your cart, saved addresses and grocery orders.</p>
  <form class="google-auth-form" method="post" action="{% url 'social:begin' 'google-oauth2' %}?next={{ request.GET.next|default:'/' }}">
    {% csrf_token %}
    <button class="btn btn-google" type="submit">Continue with Google</button>
  </form>
  <div class="auth-divider"><span>or</span></div>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Login</button>
  </form>
  <p class="auth-switch">New customer? <a href="{% url 'register' %}">Create an account</a></p>
  </div>
</section>
{% endblock %}
